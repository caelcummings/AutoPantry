<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your AutoPantry email</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; max-width: 480px; margin: 0 auto; padding: 2.5rem 1.25rem; color: #1c1c1e; }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    p { color: #3a3a3c; }
    button { appearance: none; border: 0; background: #2eb885; color: white; font-size: 1.05rem; font-weight: 600; padding: 0.9rem 1.2rem; border-radius: 14px; width: 100%; margin-top: 1.25rem; }
    button:disabled { opacity: 0.55; }
  </style>
</head>
<body>
  <h1 id="title">Confirm your email</h1>
  <p id="body">Tap the button to finish creating your AutoPantry account.</p>
  <button id="confirm" type="button" hidden>Confirm email</button>
  <script>
    const anonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwY3FldXB5Z3B0bmtnYmdreHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxOTI4NTcsImV4cCI6MjEwNzc2ODg1N30.burv0_IYnHRLJQnJ2jiSwFjexAdf3FynNqBEhezxUQQ";
    const params = new URLSearchParams(location.search);
    const tokenHash = params.get("token_hash");
    const requestedType = params.get("type") || "signup";
    const title = document.getElementById("title");
    const body = document.getElementById("body");
    const button = document.getElementById("confirm");

    function showReady(heading, text) {
      title.textContent = heading;
      body.textContent = text;
      button.hidden = true;
    }

    const alreadyUsed = "This confirmation link was already used or has expired. Open AutoPantry and sign in with your email and password.";
    const confirmed = "Open AutoPantry and sign in with your email and password.";

    if (params.get("error") || params.get("error_description")) {
      showReady("You're ready to sign in", alreadyUsed);
    } else if (params.get("code") || location.hash.includes("access_token")) {
      showReady("Email confirmed", confirmed);
    } else if (tokenHash) {
      button.hidden = false;
      button.addEventListener("click", confirm);
    } else {
      showReady("Open AutoPantry", confirmed);
    }

    async function confirm() {
      button.disabled = true;
      button.textContent = "Confirming…";
      const types = requestedType === "email" ? ["email", "signup"] : [requestedType, "email", "signup"];
      try {
        for (const type of [...new Set(types)]) {
          const response = await fetch("https://spcqeupygptnkgbgkxpl.supabase.co/auth/v1/verify", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": anonKey,
              "Authorization": "Bearer " + anonKey
            },
            body: JSON.stringify({ type: type, token_hash: tokenHash })
          });
          if (response.ok) {
            showReady("Email confirmed", confirmed);
            return;
          }
        }
        showReady("You're ready to sign in", alreadyUsed);
      } catch (error) {
        button.disabled = false;
        button.textContent = "Confirm email";
        body.textContent = "Couldn't reach AutoPantry. Check your connection and tap Confirm email again.";
      }
    }
  </script>
</body>
</html>
